<section class="main-section">
  <img src="assets/svg/Tela_níveis_fundo.svg" alt="Cenário de fundo azul escuro" class=" img-principal" />
  <div class="card-container">
    <div class="title-niveis">
      <img 
        src="assets/svg/titulo-niveis.svg" 
        class="img-titulo-niveis" 
        alt="Cenário de fundo com nuvens no céu arbustos verde e céu estilo jogo" 
      />
    </div>
    <div  class="card-niveis press-start-2p-font">
      <div *ngFor="let nivel of niveis">
        <img [src]="'assets/svg/'+ nivel.imagem + '.svg'" class="img-niveis"  alt="{{nivel.nome}}">
        <p>{{nivel.status}}</p>
        <div class="icones-nivel">
          <img *ngIf="nivel.bloqueado" src="assets/svg/cadeado.svg" class="cadeado">
          <img *ngIf="nivel.status === 'Concluido'" src="assets/svg/check.svg" class="check">
        </div>
      </div>   
    </div>
    <div class="container-setas">
      <img 
      src="assets/svg/seta-esquerda.svg" 
      alt="Seta voltar para informação anterior"
      class="img-seta-esquerda"
      (click)="navigateInicio()"
       />
    </div>
  </div>
  
</section>
